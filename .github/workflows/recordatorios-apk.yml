name: Recordatorios APK

on:
  push:
    paths:
      - 'recordatorios/**'
      - '.github/workflows/recordatorios-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recordatorios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: recordatorios-apk
          path: recordatorios/build/app/outputs/flutter-apk/app-release.apk
